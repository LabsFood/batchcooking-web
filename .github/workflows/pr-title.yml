name: PR title

# Squash merges use the PR title as the commit message, and semantic-release
# reads commit messages to pick the next version: titles must be Conventional
# Commits (feat: ..., fix(scope): ...) or the change never reaches a release.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
