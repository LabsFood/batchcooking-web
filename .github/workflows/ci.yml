name: CI

# Quality and security gates. "Batch cooking web image" (docker.yml) calls this
# before it builds, so nothing reaches a release without passing it. Also runs
# weekly: new advisories land without code changes.

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC

permissions:
  contents: read

jobs:
  quality:
    name: Lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # Checks must run on the Node the image ships.
      - name: Node version matches the image
        run: |
          set -eu
          v="$(cat .nvmrc)"
          if grep '^FROM ' Dockerfile | grep -v "^FROM node:$v-alpine"; then
            echo "::error::every FROM in Dockerfile must be node:$v-alpine… (.nvmrc)"; exit 1
          fi
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      # `next build` in the image also type-checks; this fails faster.
      - run: npm run typecheck

  sast:
    name: SAST (Semgrep, OWASP Top 10)
    runs-on: ubuntu-latest
    container: semgrep/semgrep:1.181.0
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # Registry rulesets: OWASP Top 10, TypeScript, React, hardcoded secrets,
      # workflow injection, Dockerfile.
      - name: Scan
        run: >
          semgrep scan --metrics=off
          --config p/owasp-top-ten
          --config p/typescript
          --config p/react
          --config p/secrets
          --config p/github-actions
          --config p/dockerfile
          --json-output=semgrep.json
          app components lib types middleware.ts Dockerfile .github
      # ERROR blocks; WARNING shows as an annotation only. Silence a reviewed
      # false positive with `// nosemgrep: <rule-id>` on that line.
      - name: Gate on ERROR findings
        shell: python3 {0}
        run: |
          import json, sys
          results = json.load(open("semgrep.json"))["results"]
          blocking = [r for r in results if r["extra"]["severity"] == "ERROR"]
          for r in results:
              level = "error" if r in blocking else "warning"
              print(f"::{level} file={r['path']},line={r['start']['line']}::{r['check_id']}")
          print(f"{len(results)} findings, {len(blocking)} blocking")
          sys.exit(1 if blocking else 0)
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: semgrep-report
          path: semgrep.json

  dependencies:
    name: Dependency audit (OWASP A06)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # Reads the lockfile only, no install. Lists every advisory, blocks on critical.
      - run: npm audit --omit=dev --audit-level=critical
